  # ============================================================================
  # 1-to-N: One high-level tool can be decomposed into multiple steps
  # ============================================================================
  one_to_many:
    alt_smart_light_full_control:
      description: "Composition alternative for complete smart light control"
      domain: "IoT"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "set_light_state"
              params: {device_id: "device_id", state: "state", brightness: "brightness"}

        - path_id: "toggle_then_adjust"
          tools:
            - tool_name: "set_power_state"
              params: {device_id: "device_id", state: "state"}
              output: "power_result"

            - tool_name: "update_device_config"
              params: {device_id: "device_id", property: "'brightness'", value: "brightness"}
              output: "adjust_result"

    alt_quick_buy:
      description: "Composition alternative for quick buy (reserve + finalize)"
      domain: "Shopping"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "express_checkout"
              params: {product_id: "product_id", user_id: "user_id"}

        - path_id: "reserve_then_finalize"
          tools:
            - tool_name: "hold_inventory"
              params: {product_id: "product_id", user_id: "user_id"}
              output: "reservation_data"

            - tool_name: "confirm_order"
              params: {reservation_id: "$reservation_data.reservation_id"}
              output: "order_result"

    alt_discounted_checkout:
      description: "Composition alternative for applying the best coupon before checkout"
      domain: "Shopping"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "submit_order_with_best_discount"
              params: {items: "items", user_id: "user_id", payment_method: "payment_method"}

        - path_id: "coupon_then_submit"
          tools:
            - tool_name: "get_available_coupons"
              params: {user_id: "user_id"}
              output: "coupon_data"

            - tool_name: "optimize_discount"
              params: {items: "items", user_id: "user_id", coupons_list: "$coupon_data.coupons"}
              output: "discount_data"

            - tool_name: "submit_order"
              params: {items: "items", payment_amount: "$discount_data.final_total", user_id: "user_id", payment_method: "payment_method"}
              output: "order_data"

    alt_meeting_room_booking:
      description: "Composition alternative for booking a suitable meeting room"
      domain: "Office"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "book_best_meeting_room"
              params: {attendees: "attendees", date: "date", start_time: "start_time", end_time: "end_time"}

        - path_id: "search_then_book"
          tools:
            - tool_name: "get_meeting_rooms"
              params: {min_capacity: "attendees", date: "date", start_time: "start_time"}
              output: "room_data"

            - tool_name: "select_meeting_room"
              params: {rooms: "$room_data.rooms", attendees: "attendees"}
              output: "selected_room"

            - tool_name: "book_meeting_room"
              params: {room_name: "$selected_room.room_name", attendees: "attendees", date: "date", start_time: "start_time", end_time: "end_time"}
              output: "booking_data"

    alt_safe_buy_order:
      description: "Composition alternative for risk-checked buy execution"
      domain: "Financial"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "place_buy_order_with_risk_check"
              params: {amount: "amount"}

        - path_id: "check_then_execute"
          tools:
            - tool_name: "assess_trade_risk"
              params: {amount: "amount"}
              output: "risk_data"

            - tool_name: "place_buy_order"
              params: {risk_token: "$risk_data.risk_token", price: "amount"}
              output: "order_data"

    alt_flight_booking:
      description: "Composition alternative for checking flight status before booking"
      domain: "Travel"
      paths:
        - path_id: "integrated"
          tools:
            - tool_name: "book_flight_with_status_check"
              params: {flight_number: "flight_number", passenger_name: "passenger_name", seat_class: "seat_class"}

        - path_id: "status_then_book"
          tools:
            - tool_name: "get_flight_info"
              params: {flight_number: "flight_number"}
              output: "flight_data"

            - tool_name: "book_flight"
              params: {flight_number: "flight_number", passenger_name: "passenger_name", seat_class: "seat_class"}
              output: "booking_data"

    alt_hotel_booking:
