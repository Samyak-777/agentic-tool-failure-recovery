# Tool Alternatives Relationship Table
# Centralized management of all tool alternative relationships
#
# Unified path-based format:
# - All alternatives are organized as multiple execution paths
# - Each path contains one or more tools in sequence
# - Parameter rules:
#   - Direct params: {city: "city"} - takes from input
#   - Constants: {from_currency: "'USD'"} - single quotes for string literals
#   - References: {a: "$stock_data.price"} - $ prefix for previous tool outputs
#
# Complexity scope:
# - C2 currently consumes only one_to_one / one_to_many
# - many_to_many is reserved for C3

alternatives:
