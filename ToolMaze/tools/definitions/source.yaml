- name: get_stock_yahoo_finance
  description: Get current stock price using Yahoo Finance API
  category: Source
  domain: Financial
  substitutes:
  - get_stock_alpha_vantage
  - get_stock_finnhub
  paradigms:
    function_call:
      spec:
        name: get_stock_yahoo_finance
        description: Get current price for a specified stock ticker using Yahoo Finance API, priced in USD. Free to use but may be unstable during high traffic
        parameters:
          type: object
          properties:
            ticker:
              type: string
              description: 'Stock ticker symbol, e.g.: AAPL, GOOGL, TSLA'
              enum:
              - AAPL
              - GOOGL
              - TSLA
              - MSFT
              - AMZN
          required:
          - ticker
    mcp:
      prompt_signature: 'get_stock_yahoo_finance(ticker: string) -> dict'
      prompt_description: Get current stock price using Yahoo Finance API. Parameter 'ticker' is the stock ticker symbol string. Returns a dictionary containing 'price_usd' (price in USD) and 'currency' (currency unit, fixed as 'USD') keys.
      output_schema:
        price_usd:
          type: number
        currency:
          type: string
- name: get_stock_alpha_vantage
  description: Get current stock price using Alpha Vantage API
  category: Source
  domain: Financial
  substitutes:
