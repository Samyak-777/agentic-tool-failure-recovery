  category: Source
  domain: Financial
  complexities:
  - C3
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: get_broker_balance_ledger_native
        description: Retrieve a broker-native balance ledger including ledger reference, principal id, equity value, and currency code.
        parameters:
          type: object
          properties:
            user_id:
              type: string
              description: User identifier
              default: default_user
            account_type:
              type: string
              description: Account type
              enum:
              - checking
              - savings
              - investment
              default: investment
          required:
          - user_id
    mcp:
      prompt_signature: 'get_broker_balance_ledger_native(user_id: string, account_type: string = ''investment'') -> dict'
      prompt_description: Retrieve a broker-native balance ledger. Returns a dictionary containing 'ledger_ref', 'principal_id', 'equity_value', 'currency_code', and 'account_bucket' keys.
      output_schema:
        ledger_ref:
          type: string
        principal_id:
          type: string
        equity_value:
          type: integer
        currency_code:
          type: string
        account_bucket:
          type: string
