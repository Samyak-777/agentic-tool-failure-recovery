tools:
- name: get_weather_openweather
  description: Get current weather information using OpenWeatherMap API
  category: Source
  domain: Travel
  substitutes:
  - get_weather_weatherapi
  - get_weather_visualcrossing
  paradigms:
    function_call:
      spec:
        name: get_weather_openweather
        description: Get current weather information for a specified city using OpenWeatherMap API, returns temperature and weather condition
        parameters:
          type: object
          properties:
            city:
              type: string
              description: 'City name to query weather for, e.g.: Beijing, Tokyo, Paris'
              enum:
              - Tokyo
              - Paris
              - New York
              - Beijing
              - London
              - Sydney
              - Shanghai
          required:
          - city
    mcp:
      prompt_signature: 'get_weather_openweather(city: string) -> dict'
      prompt_description: Call this tool to get current weather information using OpenWeatherMap API. Parameter 'city' is a string type representing the city name. Returns a dictionary containing 'temperature_celsius' (temperature in Celsius) and 'condition' (weather condition) keys.
      output_schema:
        temperature_celsius:
          type: integer
        condition:
          type: string
