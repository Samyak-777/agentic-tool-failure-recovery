    mcp:
      prompt_signature: 'get_stock_alpha_vantage(symbol: string) -> dict'
      prompt_description: 'Get current stock price using Alpha Vantage API. Parameter ''symbol'' is the stock ticker symbol string. Returns a dictionary containing ''price_usd'' (price in USD) and ''currency'' (currency unit, fixed as ''USD'') keys. Note: Free tier limited to 5 requests per minute.'
      output_schema:
        price_usd:
          type: number
