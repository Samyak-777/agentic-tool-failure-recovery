- name: query_availability
  description: Query calendar for available time slots within a specified time range
  category: Source
  domain: Office
  substitutes:
  - query_availability_google_calendar
  - query_availability_outlook_calendar
  - query_availability_caldav
  paradigms:
    function_call:
      spec:
        name: query_availability
        description: Query calendar for all available time slots within a specified date range
        parameters:
          type: object
          properties:
            start_date:
              type: string
              description: 'Query start date, format: YYYY-MM-DD'
              default: '2024-10-24'
            item_id:
              type: string
              description: Item or resource identifier
              enum:
              - u_alice
              - u_bob
              - u_charlie
              - u_david
            quantity:
              type: integer
              description: Quantity to check availability for
              default: 1
          required:
          - item_id
    mcp:
      prompt_signature: 'query_availability(item_id: string, start_date: string = ''2024-10-24'') -> dict'
      prompt_description: Query calendar availability by item/resource id. Input uses 'item_id' (required) and optional 'start_date'. Returns a dictionary containing 'user_id', 'query_date', 'total_slots' (count), and 'free_slots' (a list of dictionaries, each with 'date', 'start_time', 'end_time', and 'status' keys).
      output_schema:
        user_id:
          type: string
        query_date:
          type: string
        free_slots:
          type: array
        total_slots:
          type: integer
- name: get_contact_info
  description: Retrieve contact details for a person
  category: Source
  domain: Office
  substitutes:
  - get_contact_info_directory
  - get_contact_info_hris
  - get_contact_info_crm
  paradigms:
    function_call:
      spec:
        name: get_contact_info
        description: Search for a contact's email, phone, and department.
        parameters:
          type: object
          properties:
            name:
              type: string
              description: Name of the contact to search
              enum:
              - alice
              - bob
              - charlie
              - david
          required:
          - name
    mcp:
      prompt_signature: 'get_contact_info(name: string) -> dict'
      prompt_description: Get contact info. Returns a dictionary containing 'found' (boolean status), 'name' (capitalized), 'email', 'phone', 'department', and 'user_id' keys; if not found, it returns 'found' as False and an 'error' message.
      output_schema:
        found:
          type: boolean
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        user_id:
          type: string
- name: browse_storage
  description: List files in a cloud storage folder
  category: Source
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: browse_storage
        description: List files in a specified directory, optionally filtering by extension.
        parameters:
          type: object
          properties:
            folder_path:
              type: string
              description: Path to the folder (e.g., '/projects/report')
              enum:
              - /projects
              - /projects/report
              - /personal
            extension:
              type: string
              description: File extension filter (e.g., '.pdf', '.docx')
              enum:
              - .docx
              - .pdf
              - .xlsx
              - .txt
          required:
          - folder_path
    mcp:
      prompt_signature: 'browse_storage(folder_path: string, extension: string = None) -> dict'
      prompt_description: List files. Returns a dictionary containing 'found' (boolean), 'folder' (the path), 'total_count' (total files in folder), 'matched_count' (count after filtering), and 'files' (a list of dictionaries, each containing 'name', 'size', 'type', and 'owner' keys); if the folder is missing, it returns 'found' as False and a list of 'available_folders'.
      output_schema:
        found:
          type: boolean
        folder:
          type: string
        total_count:
          type: integer
        matched_count:
          type: integer
        files:
          type: array
- name: get_current_time
  description: Get current system time and date
  category: Source
  domain: General
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: get_current_time
        description: Get current system date and time information
        parameters:
          type: object
          properties:
            timezone:
              type: string
              description: 'Timezone, e.g.: UTC, Asia/Shanghai, America/New_York (optional, defaults to system timezone)'
              enum:
              - UTC
              - GMT
              - EST
              - EDT
              - CST
              - CDT
              - MST
              - MDT
              - PST
              - PDT
              - JST
              - Asia/Tokyo
              - Asia/Shanghai
              - Asia/Hong_Kong
              - Europe/London
              - Europe/Paris
              - America/New_York
              - America/Chicago
              - America/Denver
              - America/Los_Angeles
          required: []
    mcp:
      prompt_signature: 'get_current_time(timezone: string = ''UTC'') -> dict'
      prompt_description: Get current time. Parameter 'timezone' is an optional timezone string (defaults to UTC). Returns a dictionary containing 'datetime' (complete datetime string), 'date' (date), 'time' (time), 'timestamp' (Unix timestamp), and 'timezone' (timezone) keys.
      output_schema:
        datetime:
          type: string
        date:
          type: string
        time:
          type: string
        timestamp:
          type: integer
        timezone:
          type: string
        weekday:
          type: string
        iso_format:
          type: string
- name: hold_inventory
  description: Reserve inventory for a product without payment (generates reservation ID)
  category: Source
  domain: Shopping
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: hold_inventory
        description: Lock inventory for a product. Returns reservation ID valid for 5 minutes.
        parameters:
          type: object
          properties:
            product_id:
              type: string
              description: Target product ID
              enum:
              - p_sony_xm5_blk
              - p_sony_xm5_slv
              - p_apple_airpods
              - p_coke_500
            user_id:
              type: string
              description: User identifier
              default: default_user
            quantity:
              type: integer
              description: Number of items to reserve
              minimum: 1
              default: 1
          required:
          - product_id
    mcp:
      prompt_signature: 'hold_inventory(product_id: str, user_id: str = ''default_user'', quantity: int = 1) -> dict'
      prompt_description: Reserve product inventory. Returns a dictionary containing 'success' (boolean), 'reservation_id', 'expires_in' (seconds), 'product_id', 'quantity', 'total_price', and 'expiry_time' (timestamp); if the stock is insufficient, it returns 'success' as False and a list of 'suggestions' containing alternative products.
      output_schema:
        reservation_id:
          type: string
        expires_in:
          type: integer
        product_id:
          type: string
        quantity:
          type: integer
        total_price:
          type: number
        expiry_time:
          type: integer
        reservation_details:
          type: object
