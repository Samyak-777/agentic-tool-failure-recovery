- name: order_items
  description: Sort a list of items in ascending or descending order
  category: Processor
  domain: General
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: order_items
        description: Sort a list of items in specified order
        parameters:
          type: object
          properties:
            items:
              type: array
              items: {}
              description: List of items to sort
            order:
              type: string
              description: 'Sort order: ''asc'' for ascending or ''desc'' for descending (default: ''desc'')'
              enum:
              - asc
              - desc
            key:
              type: string
              description: If items are dictionaries, sort by this key (optional, automatically detected if not provided)
          required:
          - items
    mcp:
      prompt_signature: 'order_items(items: list, order: string = ''asc'', key: string = None) -> dict'
      prompt_description: Sort list items. Parameter 'items' is the list to sort, 'order' is the sort order, 'key' is optional for sorting dictionaries (automatically detected if not provided). Returns a dictionary containing 'sorted_items', 'count', and 'order' keys.
      output_schema:
        sorted_items:
          type: array
        count:
          type: integer
        order:
          type: string
- name: diagnose_device_health
  description: Batch analyze multiple IoT devices (3+) to identify those with health issues
  category: Processor
  domain: IoT
  substitutes: []
  usage_note: ONLY use when analyzing 3 or more devices simultaneously. For single device checks, use the status information directly from get_iot_device_status.
  paradigms:
    function_call:
      spec:
        name: diagnose_device_health
        description: Analyze a list of device status objects and return those that are offline, low battery, or reporting errors using the Device Health Diagnostics API.
        parameters:
          type: object
          properties:
            devices_data:
              type: array
              items:
                type: object
                description: output from get_iot_device_status
              description: List of device status dictionaries
            status_criteria:
              type: string
              description: 'Criteria to filter by: ''offline'', ''low_battery'', ''error'', ''all_issues'''
              enum:
              - offline
              - low_battery
              - error
              - all_issues
          required:
          - devices_data
    mcp:
      prompt_signature: 'diagnose_device_health(devices_data: list, status_criteria: string = ''all_issues'') -> dict'
      prompt_description: Diagnose device health issues. 'devices_data' is a list of device objects output from status type function. 'status_criteria' defaults to 'all_issues'. Returns a dictionary with 'abnormal_devices' (list), 'count', and 'issues_found' keys.
      output_schema:
        count:
          type: integer
        status_criteria:
          type: string
        abnormal_devices:
          type: array
