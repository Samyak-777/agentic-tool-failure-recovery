        room_name:
          type: string
        capacity:
          type: integer
        equipment:
          type: array
        selection_reason:
          type: string
- name: get_field_value
  description: Extract a specific value from complex nested data structures (3+ levels deep) or perform filtering operations
  category: Processor
  domain: General
  substitutes: []
  usage_note: ONLY use when dealing with deeply nested data or complex filtering. For simple list[0] or dict['key'] access, reference directly in arg_bindings instead.
  paradigms:
    function_call:
      spec:
        name: get_field_value
        description: Extracts a specific field from the previous step's output. Returns the result wrapped in an 'extracted_value' key.
        parameters:
          type: object
          properties:
            data:
              description: The specific output field from the previous step to process (e.g., 'headlines', 'product_list', 'metadata'). Can be a List or Dictionary. Do NOT try to reference the entire step output.
            target_field:
              type: string
              description: The specific key to extract. If omitted, extracts the first available value.
              default: null
            index:
              type: integer
              description: 'If data is a list, the index to extract (default: 0).'
              default: 0
            field_name:
              type: string
              description: Alias for target_field
              default: ''
          required:
          - data
    mcp:
      prompt_signature: 'get_field_value(data: any, target_field: string = None, index: int = 0, field_name: string = '''') -> dict'
      prompt_description: 'Extract data. Input ''data'' must be a REFERENCE to a specific output field from the previous step (e.g. step_1.results). Returns {''extracted_value'': <value>}.'
      output_schema:
        source_type:
          type: string
        extracted_value:
          type: string
