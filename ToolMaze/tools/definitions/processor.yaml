tools:
- name: get_exchange_rate_fixer
  description: Get exchange rate using Fixer.io API
  category: Processor
  domain: Financial
  substitutes:
  - get_exchange_rate_exchangerate
  - get_exchange_rate_currencyapi
  paradigms:
    function_call:
      spec:
        name: get_exchange_rate_fixer
        description: Get exchange rate using Fixer.io API, data sourced from European Central Bank
        parameters:
          type: object
          properties:
            from_currency:
              type: string
              description: 'Source currency code, e.g.: USD, EUR, JPY'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
            to_currency:
              type: string
              description: 'Target currency code, e.g.: USD, EUR, JPY'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
            from:
              type: string
              description: Alias for from_currency
            to:
              type: string
              description: Alias for to_currency
          required:
          - from_currency
          - to_currency
    mcp:
      prompt_signature: 'get_exchange_rate_fixer(from_currency: string, to_currency: string, from: string = '''', to: string = '''') -> dict'
      prompt_description: Get currency exchange rate using Fixer.io API. Parameters 'from_currency' and 'to_currency' are currency code strings. Returns a dictionary containing 'rate' key, indicating how much target currency equals 1 unit of source currency.
      output_schema:
        rate:
          type: number
- name: get_exchange_rate_exchangerate
  description: Get exchange rate using ExchangeRate-API
  category: Processor
  domain: Financial
  substitutes:
  - get_exchange_rate_fixer
  - get_exchange_rate_currencyapi
  paradigms:
    function_call:
      spec:
        name: get_exchange_rate_exchangerate
        description: Get exchange rate using ExchangeRate-API, high free tier quota and fast update frequency
        parameters:
          type: object
          properties:
            from_currency:
              type: string
              description: 'Source currency code, e.g.: USD, EUR, JPY'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
            to_currency:
              type: string
              description: 'Target currency code, e.g.: USD, EUR, JPY'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
          required:
          - from_currency
          - to_currency
    mcp:
      prompt_signature: 'get_exchange_rate_exchangerate(from_currency: string, to_currency: string) -> dict'
      prompt_description: Get currency exchange rate using ExchangeRate-API. Parameters 'from_currency' and 'to_currency' are currency code strings. Returns a dictionary containing 'rate' key.
      output_schema:
        rate:
          type: number
- name: get_exchange_rate_currencyapi
  description: Get exchange rate using CurrencyAPI
  category: Processor
  domain: Financial
  substitutes:
  - get_exchange_rate_fixer
  - get_exchange_rate_exchangerate
  paradigms:
    function_call:
      spec:
        name: get_exchange_rate_currencyapi
        description: Get exchange rate using CurrencyAPI, supports cryptocurrency and diverse data sources
        parameters:
          type: object
          properties:
            from_currency:
              type: string
              description: 'Source currency code, e.g.: USD, EUR, JPY, BTC'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
              - BTC
            to_currency:
              type: string
              description: 'Target currency code, e.g.: USD, EUR, JPY, BTC'
              enum:
              - USD
              - EUR
              - JPY
              - GBP
              - CNY
              - BTC
          required:
          - from_currency
          - to_currency
    mcp:
      prompt_signature: 'get_exchange_rate_currencyapi(from_currency: string, to_currency: string) -> dict'
      prompt_description: Get currency exchange rate using CurrencyAPI. Supports both fiat and cryptocurrency. Parameters 'from_currency' and 'to_currency' are currency code strings. Returns a dictionary containing 'rate' key.
      output_schema:
        rate:
          type: number
