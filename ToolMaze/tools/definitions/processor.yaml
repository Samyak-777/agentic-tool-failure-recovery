          type: string
        date:
          type: string
        users_checked:
          type: array
        duration_minutes:
          type: integer
        recommended_slot:
          type: object
        message:
          type: string
- name: select_meeting_room
  description: Choose the best meeting room from a list of available rooms
  category: Processor
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: select_meeting_room
        description: Pick the smallest available room that can accommodate the requested attendee count.
        parameters:
          type: object
