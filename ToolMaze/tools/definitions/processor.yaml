  substitutes: []
  paradigms:
    function_call:
      spec:
        name: find_meeting_time
        description: Calculate the first available common time slot for a group of users.
        parameters:
          type: object
          properties:
            user_ids:
              type: array
              items:
                type: string
              description: List of user IDs to coordinate
              enum:
              - - u_alice
                - u_bob
              - - u_alice
                - u_charlie
              - - u_bob
                - u_david
              - - u_alice
                - u_bob
