      prompt_description: Find common slot. Returns a dictionary containing 'status' (success or failure), 'date', 'users_checked' (list of IDs), and 'duration_minutes' (integer); if successful, it includes a 'recommended_slot' dictionary (with 'start_time' and 'end_time') and a 'message' string.
