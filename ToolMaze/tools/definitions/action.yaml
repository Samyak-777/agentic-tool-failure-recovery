- name: restart_device
  description: Restart a smart device
  category: Action
  domain: IoT
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: restart_device
        description: Perform a hard restart of an IoT device. Useful for recovering from 'offline' or 'not responding' states.
        parameters:
          type: object
          properties:
            device_id:
              type: string
              description: 'Target device ID to reboot (default: ''ac_bedroom'')'
              enum:
              - lock_main
              - lock_bedroom
              - light_living
              - light_bedroom
              - ac_living
              - ac_bedroom
              - tv_living
              - sensor_bedroom_window
              - tv_bedroom
          required:
          - device_id
    mcp:
      prompt_signature: 'restart_device(device_id: string) -> dict'
      prompt_description: Reboot IoT device. Use this when a device is unresponsive or offline. Returns a dictionary with 'success', 'status', and 'reboot_time'.
      output_schema:
        device_id:
          type: string
        status:
          type: string
        message:
          type: string
        timestamp:
          type: string
- name: set_light_brightness
  description: Adjust light brightness using a integer
  category: Action
  domain: IoT
  substitutes:
  - set_light_state
  paradigms:
    function_call:
      spec:
        name: set_light_brightness
        description: Set the brightness of a light using a integer value (0 to 100) via the SmartLight Control API.
        parameters:
          type: object
          properties:
            light_id:
              type: string
              description: The ID of the light
              enum:
