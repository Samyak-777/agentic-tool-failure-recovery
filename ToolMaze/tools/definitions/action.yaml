tools:
- name: send_email
  description: Send email to specified recipients
  category: Action
  domain: Office
  substitutes:
  - send_instant_message
  paradigms:
    function_call:
      spec:
        name: send_email
        description: Send an email message. Suitable for formal communication.
        parameters:
          type: object
          properties:
            body:
              type: string
              description: Email content
            recipients:
              type: array
              items:
                type: string
              description: List of email addresses
              default:
              - admin@company.com
            subject:
              type: string
              description: Email subject
              default: No Subject
          required:
          - body
          - recipients
    mcp:
      prompt_signature: 'send_email(body: string, recipients: list = [''admin@company.com''], subject: string = ''No Subject'') -> dict'
      prompt_description: Send email. Returns success status.
      output_schema:
        status:
          type: string
        message:
          type: string
        recipients:
          type: array
        subject:
          type: string
        body_length:
          type: integer
- name: send_instant_message
  description: Send a quick IM to a user
  category: Action
  domain: Office
  substitutes:
  - send_email
  paradigms:
    function_call:
      spec:
        name: send_instant_message
        description: Send a real-time message via IM (e.g., Slack/Teams). Suitable for urgent or informal chats.
        parameters:
          type: object
          properties:
            user_id:
              type: string
              description: Recipient User ID
              default: alice
              enum:
              - alice
              - bob
              - charlie
              - david
              - u_alice
              - u_bob
              - u_charlie
              - u_david
            message:
              type: string
              description: Message content
          required:
          - message
    mcp:
      prompt_signature: 'send_instant_message(message: string, user_id: string = ''alice'') -> dict'
      prompt_description: Send IM. Returns success status and timestamp.
      output_schema:
        status:
          type: string
        channel:
          type: string
        recipient_id:
          type: string
        message_preview:
          type: string
- name: schedule_meeting
  description: Schedule a meeting event
  category: Action
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: schedule_meeting
        description: Create a calendar event and invite participants.
        parameters:
          type: object
          properties:
            title:
              type: string
              description: Meeting title
              default: Meeting_01
            participants:
              type: array
              items:
                type: string
              description: List of participant emails
              default:
              - alice@company.com
            start_time:
              type: string
              description: ISO 8601 start time (YYYY-MM-DD HH:MM)
            end_time:
              type: string
              description: ISO 8601 end time (YYYY-MM-DD HH:MM). Default empty string means 1 hour after start time.
              default: ''
          required:
          - start_time
    mcp:
      prompt_signature: 'schedule_meeting(start_time: string, title: string = ''Meeting_01'', participants: list = [''alice@company.com''], end_time: string (default 1 hour after the start time)) -> dict'
      prompt_description: Schedule meeting. Returns event_id and status.
      output_schema:
        status:
          type: string
        message:
          type: string
        meeting_id:
          type: string
        title:
          type: string
        participants:
          type: array
        participant_count:
          type: integer
        start_time:
          type: string
        end_time:
          type: string
        invitation_status:
          type: string
- name: create_reminder
  description: Create a personal reminder
  category: Action
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: create_reminder
        description: Create a reminder with title and datetime.
        parameters:
          type: object
          properties:
            datetime:
              type: string
              description: Reminder datetime (YYYY-MM-DD HH:MM)
            description:
              type: string
              description: Optional reminder description
              default: ''
            priority:
              type: string
              description: Priority level (low, medium, high)
              enum:
              - low
              - medium
              - high
              default: medium
            title:
              type: string
              description: Reminder title
              default: Reminder 1
          required:
          - datetime
          - title
    mcp:
      prompt_signature: 'create_reminder(datetime: string, description: string = '''', priority: string = ''medium'', title: string = ''Reminder 1'') -> dict'
      prompt_description: Create reminder. 'title' and 'datetime' are required. Returns a dictionary containing 'success', 'reminder_id', 'title', 'datetime', 'description', 'priority', and 'status'.
      output_schema:
        message:
          type: string
        reminder_id:
          type: string
        title:
          type: string
        datetime:
          type: string
        description:
          type: string
        priority:
          type: string
        status:
          type: string
- name: book_meeting_room
  description: Reserve a physical meeting room
  category: Action
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: book_meeting_room
        description: Book a room resource. Essential for offline meetings.
        parameters:
          type: object
          properties:
            room_name:
              type: string
              description: Name of the room (e.g., 'Conference A')
              enum:
              - Conference Room A
              - Conference Room B
              - Meeting Room 1
              - Meeting Room 2
            date:
              type: string
              description: Booking date (YYYY-MM-DD)
              default: '2026-01-15'
            start_time:
              type: string
              description: ISO start time
              default: '14:00'
            end_time:
              type: string
              description: ISO end time
              default: '15:00'
            attendees:
              type: integer
              description: Number of attendees
              default: 10
          required:
          - room_name
    mcp:
      prompt_signature: 'book_meeting_room(room_name: string, date: string = ''2026-01-15'', start_time: string = ''14:00'', end_time: string = ''15:00'', attendees: int = 10) -> dict'
      prompt_description: Book room. Returns booking_id and status.
      output_schema:
        message:
          type: string
        booking_id:
          type: string
        room_name:
          type: string
        date:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        attendees:
          type: integer
        capacity:
          type: integer
        equipment:
          type: array
- name: book_best_meeting_room
  description: Automatically choose and book the best available meeting room
  category: Action
  domain: Office
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: book_best_meeting_room
        description: Find the smallest suitable available room and book it in one step.
        parameters:
          type: object
          properties:
            attendees:
              type: integer
              description: Number of attendees that must fit in the room
            date:
              type: string
              description: Booking date (YYYY-MM-DD)
              default: '2026-01-15'
            start_time:
              type: string
              description: ISO start time
              default: '14:00'
            end_time:
              type: string
              description: ISO end time
              default: '15:00'
          required:
          - attendees
    mcp:
      prompt_signature: 'book_best_meeting_room(attendees: int, date: string = ''2026-01-15'', start_time: string = ''14:00'', end_time: string = ''15:00'') -> dict'
      prompt_description: Automatically choose and book a meeting room. Returns booking_id, room_name, and booking details.
      output_schema:
        message:
          type: string
        booking_id:
          type: string
        room_name:
          type: string
        date:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        attendees:
          type: integer
        capacity:
          type: integer
        equipment:
          type: array
        selection_reason:
          type: string
- name: create_document
  description: Save a text note to storage
  category: Action
  domain: General
  substitutes: []
  paradigms:
