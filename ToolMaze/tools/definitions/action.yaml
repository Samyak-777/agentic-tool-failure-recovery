- name: set_light_state
  description: Control smart light settings (power, brightness, color)
  category: Action
  domain: IoT
  substitutes:
  - set_light_brightness
  paradigms:
    function_call:
      spec:
        name: set_light_state
        description: Turn light on/off, adjust brightness, or change color
        parameters:
          type: object
          properties:
            device_id:
              type: string
              description: Target light device ID
              enum:
              - light_living
              - light_bedroom
            state:
              type: string
              description: Power state
              enum:
              - 'on'
              - 'off'
              default: 'on'
            brightness:
              type: integer
              description: Brightness level (0-100)
              minimum: 0
              maximum: 100
              default: 80
            color:
              type: string
              description: Color value (hex code or normal color name like 'red', 'warm_white')
              default: white
          required:
          - device_id
    mcp:
      prompt_signature: 'set_light_state(device_id: string, state: string = ''on'', brightness: int = 80, color: string = ''white'') -> dict'
      prompt_description: 'Control smart light. ''device_id'' (''light_living''/''light_bedroom'') is required. Optional parameters: ''state'' (''on''/''off''), ''brightness'' (0-100), ''color'' (string). Returns status dictionary.'
      output_schema:
        device_id:
          type: string
        operation:
          type: string
        changes:
          type: object
        status:
          type: string
