              description: List of tags (optional)
              default: []
          required:
          - content
    mcp:
      prompt_signature: 'create_document(content: string, title: string = ''Untitled'', tags: list = []) -> dict'
      prompt_description: Create document. Parameter 'content' is required, 'title' and 'tags' are optional. Returns a dictionary containing 'success', 'note_id', 'title', 'content_length', 'tags', and 'timestamp' keys.
      output_schema:
        message:
          type: string
        note_id:
          type: string
        title:
          type: string
        content_length:
          type: integer
        tags:
          type: array
        timestamp:
          type: string
- name: push_alert
  description: Send a notification message
  category: Action
  domain: General
  substitutes: []
  paradigms:
    function_call:
      spec:
        name: push_alert
        description: Send a notification message through specified channel using the Alert Service API
        parameters:
          type: object
          properties:
            message:
              type: string
              description: Notification message content
            user_id:
              type: string
              description: User ID to send notification to
              default: default_user
            priority:
              type: string
              description: 'Priority level: low, medium, high (default: medium)'
              enum:
              - low
              - medium
              - high
              default: medium
            channel:
              type: string
              description: 'Notification channel: app, sms, email (default: app)'
              enum:
              - app
              - sms
              - email
              default: app
          required:
          - message
    mcp:
      prompt_signature: 'push_alert(message: string, user_id: string = ''default_user'', priority: string = ''medium'', channel: string = ''app'') -> dict'
      prompt_description: Send notification. Parameter 'message' is required, 'user_id', 'priority' and 'channel' are optional. Returns a dictionary containing 'success', 'notification_id', 'user_id', 'content', and 'priority' keys.
      output_schema:
        message:
          type: string
        notification_id:
          type: string
        user_id:
          type: string
        content:
          type: string
        priority:
          type: string
