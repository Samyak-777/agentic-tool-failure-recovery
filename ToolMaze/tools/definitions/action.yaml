              description: Brightness level from 0 (off) to 100 (max)
              minimum: 0
              maximum: 100
          required:
          - light_id
          - brightness
    mcp:
      prompt_signature: 'set_light_brightness(light_id: string, brightness: int) -> dict'
      prompt_description: Set brightness level. Parameter 'level' is a integer from 0 to 100.
      output_schema:
        device:
          type: string
        set_level:
          type: integer
        actual_brightness:
          type: integer
        message:
          type: string
