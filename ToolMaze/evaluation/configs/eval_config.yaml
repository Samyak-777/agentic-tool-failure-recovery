# Evaluation Configuration

# ========== Agent Configuration ==========
agent:
  # Agent type: openai, anthropic, vllm, mcp
  #
  # Tool calling paradigms:
  # - openai:    OpenAI API with native function calling (tools parameter)
  # - anthropic: Anthropic API with native tool use
  # - vllm:      VLLM-deployed models with OpenAI-compatible function calling
  # - mcp:       Prompt-based tool calling (MCP style)
  #              Tools are injected into system prompt, model outputs JSON blocks
  #              Uses task_json["tool_definitions"]["mcp"] for tool descriptions
  #              Compatible with any OpenAI-compatible API endpoint
  #
  type: "vllm"

  # Model settings
  model: "qwen3.6-35b-a3b"
  temperature: 1
  max_tokens: 32000

  # API credentials (use environment variables for security)
  api_key: ""
  base_url: ""

# ========== Judge Configuration ==========
judge:
  model: "qwen3.6-35b-a3b"
  temperature: 1
  api_key: ""
  base_url: ""


# ========== Execution Configuration ==========
execution:
  max_rounds: 25
  timeout_per_round: 1000

# ========== Data Paths ==========
data:
  # Task data directory
  task_dir: "data/perturbed_tasks/c1"

  # Base output directory (results will be saved to: {output_dir}/{model}/{fc|mcp}/{task_category}/)
  output_dir: "evaluation/results"

  # Task category (c1 / c2 / c3 / c4)
  task_category: "c1"

  # Tools directory
  tools_dir: "tools"

  # Template directory (for DAG-based dependency analysis in judge)
  template_dir: "data/templates"

# ========== Evaluation Settings ==========
evaluation:
  # Modes to evaluate
  modes: ["P0", "P1", "P2", "P3", "P4"]

  # Parallel execution
  parallel: true
  max_workers: 10

  # Save intermediate results
  save_traces: true

# ========== Logging ==========
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ========== Semantic Validation Layer (SVL) ==========
validation:
  enabled: false               # Master switch: false preserves exact baseline
  fail_mode: "open"            # "open" (recommended) or "closed"

  checkers:
    schema: true               # L1: Schema Verification
    type: true                 # L2: Data Type Enforcement
    required: true             # L3: Required Field Checks
    range: true                # L4: Value Range Validation
    temporal: true             # L5: Temporal Consistency
    entity: true               # L6: Entity Consistency
    cross_field: true          # L7: Cross-Field Rules
    state: true                # L8: Accumulated State
    cross_tool: true           # L9: Cross-Tool Consistency
    llm: false                 # L10: Independent LLM Verification (off by default)

  temporal:
    max_timestamp_age_seconds: null   # null = disabled
    future_timestamp_warning: true

  llm:
    model: null                # If null, uses judge model from config
    max_tokens: 256
    timeout_seconds: 10

